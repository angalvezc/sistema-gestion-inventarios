<!DOCTYPE html>
<html lang="es">
  <head>
    <title>LogiTech Solutions S.A.S. - APIs (Swagger UI)</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <style>
      body { margin: 0; padding: 0; font-family: sans-serif; }
      .top-bar { background-color: #20232a; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
      select { padding: 8px; font-size: 14px; border-radius: 4px; border: none; }
    </style>
  </head>
  <body>
    <!-- Barra superior de navegación -->
    <div class="top-bar">
      <strong>LogiTech API Docs:</strong>
      <select id="api-selector" onchange="loadApi()">
        <option value="./openapi/ms-auth-user.yaml">ms-auth-users</option>
        <option value="./openapi/ms-products.yaml">ms-products</option>
        <option value="./openapi/ms-inventory-stock.yaml" selected>ms-inventory-stock</option>
        <option value="./openapi/ms-suppliers.yaml">ms-suppliers</option>
        <option value="./openapi/ms-purchases.yaml">ms-purchases</option>
        <option value="./openapi/ms-returns-audit.yaml">ms-returns-audit</option>
      </select>
    </div>
    
    <!-- Contenedor para Swagger UI -->
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script>
      function loadApi() {
        const selectedUrl = document.getElementById('api-selector').value;
        window.ui = SwaggerUIBundle({
          url: selectedUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [ SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset ],
          layout: "BaseLayout"
        });
      }
      loadApi();
    </script>
  </body>
</html>
