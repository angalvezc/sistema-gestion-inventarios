openapi: 3.0.0
info:
  title: ms-purchases API
  version: 1.1.0
  description: |
    Órdenes de compra de reabastecimiento y su ciclo de aprobación (RF09) y recepción (RF10).

    Ciclo de estados: DRAFT --approve--> APPROVED --receive--> RECEIVED;
    DRAFT o APPROVED --cancel--> CANCELLED. Una transición no permitida responde 409.

    Al crear, valida por REST que el proveedor (ms-suppliers) y los productos
    (ms-products) existan y estén activos; si esos servicios no responden, responde 503.
    Al recibir, publica el evento purchase.received para que ms-inventory-stock sume el stock.
    Roles: los aplica el API Gateway según la tabla de la Entrega 2, §2.1.
servers:
  - url: /api/v1
tags:
  - name: Órdenes de compra
paths:
  /purchases/orders:
    get:
      summary: Listar órdenes de compra (todos los roles)
      tags: [Órdenes de compra]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: supplierId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Órdenes paginadas, de la más reciente a la más antigua (sin ítems)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Crear orden de compra en estado DRAFT (ADMIN)
      tags: [Órdenes de compra]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreate'
      responses:
        '201':
          description: Orden creada en estado DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: ms-products o ms-suppliers no están disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/orders/{id}:
    get:
      summary: Detalle de la orden con ítems e historial de estados (todos los roles)
      tags: [Órdenes de compra]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Detalle de la orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /purchases/orders/{id}/approve:
    post:
      summary: Aprobar orden, DRAFT -> APPROVED (ADMIN)
      tags: [Órdenes de compra]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/OrderOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /purchases/orders/{id}/receive:
    post:
      summary: Marcar orden como recibida, APPROVED -> RECEIVED, e incrementar stock (ADMIN, WAREHOUSE_OPERATOR)
      description: Publica el evento purchase.received a RabbitMQ (patrón Outbox). Si dos peticiones llegan a la vez, solo una tiene éxito.
      tags: [Órdenes de compra]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/OrderOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /purchases/orders/{id}/cancel:
    post:
      summary: Cancelar orden si no fue recibida (ADMIN)
      tags: [Órdenes de compra]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/OrderOk'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    OrderOk:
      description: Orden con su nuevo estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchaseOrder'
    BadRequest:
      description: Datos inválidos (incluye proveedor o productos inexistentes o dados de baja)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Orden no encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidState:
      description: Transición no permitida (code INVALID_STATE; details con currentStatus y targetStatus)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OrderStatus:
      type: string
      enum: [DRAFT, APPROVED, RECEIVED, CANCELLED]
    PurchaseOrderCreate:
      type: object
      required: [supplierId, destinationWarehouseId, items]
      properties:
        supplierId:
          type: string
          format: uuid
        destinationWarehouseId:
          type: integer
          description: 1 = BOD-A (Manizales), 2 = BOD-B (Medellín)
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
    PurchaseOrderItem:
      type: object
      required: [productId, quantity, unitCost]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitCost:
          type: number
          format: float
          minimum: 0
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: string
          format: uuid
        sku:
          type: string
          description: SKU del producto al momento de la compra
        quantity:
          type: integer
        unitCost:
          type: number
        subtotal:
          type: number
    StatusChange:
      type: object
      properties:
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        changedBy:
          type: string
          format: uuid
          nullable: true
        changedAt:
          type: string
          format: date-time
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          example: OC-000001
        supplierId:
          type: string
          format: uuid
        destinationWarehouseId:
          type: integer
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: number
        createdBy:
          type: string
          format: uuid
          nullable: true
        approvedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          description: Solo en el detalle y en las respuestas de creación y cambio de estado
          items:
            $ref: '#/components/schemas/OrderItem'
        history:
          type: array
          description: Solo en el detalle y en las respuestas de creación y cambio de estado
          items:
            $ref: '#/components/schemas/StatusChange'
    OrderPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrder'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    Error:
      type: object
      properties:
        code:
          type: string
          example: INVALID_STATE
        message:
          type: string
        details:
          nullable: true
        timestamp:
          type: string
          format: date-time
        path:
          type: string
