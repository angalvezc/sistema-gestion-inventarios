openapi: 3.0.0
info:
  title: ms-purchases API
  version: 1.0.0
  description: Gestión de órdenes de reabastecimiento y compras.
servers:
  - url: /api/v1
paths:
  /purchases/orders:
    post:
      summary: Crear orden de compra
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreate'
      responses:
        '201':
          description: Orden creada en estado DRAFT
  /purchases/orders/{id}/receive:
    post:
      summary: Marcar orden como recibida e incrementar stock
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Orden recibida, evento publicado a RabbitMQ
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PurchaseOrderCreate:
      type: object
      required: [supplierId, destinationWarehouseId, items]
      properties:
        supplierId:
          type: string
          format: uuid
        destinationWarehouseId:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
    PurchaseOrderItem:
      type: object
      required: [productId, quantity, unitCost]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
        unitCost:
          type: number
          format: float