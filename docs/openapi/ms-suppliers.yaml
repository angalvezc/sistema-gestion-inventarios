openapi: 3.0.0
info:
  title: ms-suppliers API
  version: 1.0.0
  description: Directorio de proveedores de LogiTech.
servers:
  - url: /api/v1
paths:
  /suppliers:
    get:
      summary: Listar proveedores
      responses:
        '200':
          description: Directorio de proveedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
    post:
      summary: Crear un nuevo proveedor (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreate'
      responses:
        '201':
          description: Proveedor creado
  /suppliers/{id}:
    get:
      summary: Consultar detalle de proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del proveedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
    put:
      summary: Actualizar datos del proveedor (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreate'
      responses:
        '200':
          description: Proveedor actualizado
    delete:
      summary: Dar de baja a un proveedor (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Proveedor desactivado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Supplier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nit:
          type: string
        businessName:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        paymentTerms:
          type: string
        leadTimeDays:
          type: integer
        active:
          type: boolean
    SupplierCreate:
      type: object
      required: [nit, businessName, email, paymentTerms, leadTimeDays]
      properties:
        nit:
          type: string
        businessName:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        paymentTerms:
          type: string
        leadTimeDays:
          type: integer