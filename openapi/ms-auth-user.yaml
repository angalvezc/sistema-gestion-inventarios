openapi: 3.0.3
info:
  title: ms-auth-users API
  version: 1.0.0
  description: Servicio de autenticación, emisión de JWT y gestión de usuarios.
paths:
  /api/v1/auth/login:
    post:
      summary: Autenticar usuario y obtener JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@logitech.com
                password:
                  type: string
                  example: Admin123!
      responses:
        '200':
          description: Autenticación exitosa
        '401':
          description: Credenciales inválidas
  /api/v1/users:
    get:
      summary: Listar usuarios del sistema (ADMIN)
      responses:
        '200':
          description: Lista de usuarios