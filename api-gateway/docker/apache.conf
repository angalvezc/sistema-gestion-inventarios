# Sitio de Apache para Laravel: solo la carpeta public/ queda expuesta.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Permite el .htaccess de Laravel (envía todo a index.php y conserva el
        # encabezado Authorization con el JWT).
        AllowOverride All
        Require all granted
    </Directory>

    # En la imagen oficial estos archivos apuntan a la salida estándar del
    # contenedor: se ven con "docker compose logs api-gateway".
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
