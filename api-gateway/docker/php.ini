; Ajustes de PHP para producción.
; OPcache guarda el código PHP ya compilado en memoria: sin él, cada petición
; recompila Laravel completo (importante para RNF06 y las pruebas de carga).
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; No anunciar la versión de PHP en las respuestas.
expose_php=Off

; Tamaño máximo del cuerpo de una petición.
post_max_size=2M
