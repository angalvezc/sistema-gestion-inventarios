# Entorno local completo (RNF14).
# Uso (desde la raíz del repositorio):
#   cp docker/.env.example docker/.env
#   docker compose -f docker/docker-compose.yml up -d
#
# Ningún puerto de base de datos ni de microservicio se publica al host:
# solo el API Gateway (se agrega en el Paso 3) y la consola de RabbitMQ.

name: logitech

# Configuración común de las 6 bases de datos (Database-per-Service, RNF02)
x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ---------------- Persistencia ----------------
  db-auth:
    <<: *postgres
    environment:
      POSTGRES_DB: db_auth
      POSTGRES_USER: ${DB_AUTH_USER}
      POSTGRES_PASSWORD: ${DB_AUTH_PASSWORD}
    volumes: [db-auth-data:/var/lib/postgresql/data]

  db-products:
    <<: *postgres
    environment:
      POSTGRES_DB: db_products
      POSTGRES_USER: ${DB_PRODUCTS_USER}
      POSTGRES_PASSWORD: ${DB_PRODUCTS_PASSWORD}
    volumes: [db-products-data:/var/lib/postgresql/data]

  db-stock:
    <<: *postgres
    environment:
      POSTGRES_DB: db_stock
      POSTGRES_USER: ${DB_STOCK_USER}
      POSTGRES_PASSWORD: ${DB_STOCK_PASSWORD}
    volumes: [db-stock-data:/var/lib/postgresql/data]

  db-suppliers:
    <<: *postgres
    environment:
      POSTGRES_DB: db_suppliers
      POSTGRES_USER: ${DB_SUPPLIERS_USER}
      POSTGRES_PASSWORD: ${DB_SUPPLIERS_PASSWORD}
    volumes: [db-suppliers-data:/var/lib/postgresql/data]

  db-purchases:
    <<: *postgres
    environment:
      POSTGRES_DB: db_purchases
      POSTGRES_USER: ${DB_PURCHASES_USER}
      POSTGRES_PASSWORD: ${DB_PURCHASES_PASSWORD}
    volumes: [db-purchases-data:/var/lib/postgresql/data]

  db-audit:
    <<: *postgres
    environment:
      POSTGRES_DB: db_audit
      POSTGRES_USER: ${DB_AUDIT_USER}
      POSTGRES_PASSWORD: ${DB_AUDIT_PASSWORD}
    volumes: [db-audit-data:/var/lib/postgresql/data]

  # ---------------- Message Broker (RNF08) ----------------
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    networks: [backend]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"   # consola web de administración (solo para desarrollo)
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Microservicios ----------------
  # Sin "ports": solo son alcanzables dentro de la red backend (vía API Gateway).
  ms-auth-users:
    build:
      context: ..                                # raíz del repositorio
      dockerfile: services/ms-auth-users/Dockerfile
    image: logitech/ms-auth-users:1.0.0
    restart: unless-stopped
    networks: [backend]
    environment:
      PORT: 8081
      DB_HOST: db-auth
      DB_PORT: 5432
      DB_NAME: db_auth
      DB_USER: ${DB_AUTH_USER}
      DB_PASSWORD: ${DB_AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db-auth:
        condition: service_healthy

  ms-products:
    build:
      context: ..
      dockerfile: services/ms-products/Dockerfile
    image: logitech/ms-products:1.0.0
    restart: unless-stopped
    networks: [backend]
    environment:
      PORT: 8082
      DB_HOST: db-products
      DB_PORT: 5432
      DB_NAME: db_products
      DB_USER: ${DB_PRODUCTS_USER}
      DB_PASSWORD: ${DB_PRODUCTS_PASSWORD}
    depends_on:
      db-products:
        condition: service_healthy

  ms-suppliers:
    build:
      context: ..
      dockerfile: services/ms-suppliers/Dockerfile
    image: logitech/ms-suppliers:1.0.0
    restart: unless-stopped
    networks: [backend]
    environment:
      PORT: 8084
      DB_HOST: db-suppliers
      DB_PORT: 5432
      DB_NAME: db_suppliers
      DB_USER: ${DB_SUPPLIERS_USER}
      DB_PASSWORD: ${DB_SUPPLIERS_PASSWORD}
    depends_on:
      db-suppliers:
        condition: service_healthy

  ms-purchases:
    build:
      context: ..
      dockerfile: services/ms-purchases/Dockerfile
    image: logitech/ms-purchases:1.0.0
    restart: unless-stopped
    networks: [backend]
    environment:
      PORT: 8085
      DB_HOST: db-purchases
      DB_PORT: 5432
      DB_NAME: db_purchases
      DB_USER: ${DB_PURCHASES_USER}
      DB_PASSWORD: ${DB_PURCHASES_PASSWORD}
      PRODUCTS_URL: http://ms-products:8082     # validación REST al crear órdenes
      SUPPLIERS_URL: http://ms-suppliers:8084
      WAREHOUSE_IDS: "1,2"                      # BOD-A (Manizales) y BOD-B (Medellín)
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    # Solo espera a su base de datos. NO depende de products, suppliers ni RabbitMQ
    # para arrancar (RNF09): si caen, solo falla crear órdenes nuevas.
    depends_on:
      db-purchases:
        condition: service_healthy

  ms-inventory-stock:
    build:
      context: ..
      dockerfile: services/ms-inventory-stock/Dockerfile
    image: logitech/ms-inventory-stock:1.0.0
    restart: unless-stopped
    networks: [backend]
    environment:
      PORT: 8083
      DB_HOST: db-stock
      DB_PORT: 5432
      DB_NAME: db_stock
      DB_USER: ${DB_STOCK_USER}
      DB_PASSWORD: ${DB_STOCK_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    # Solo espera a su base de datos. NO depende de RabbitMQ a propósito (RNF09):
    # si el broker cae, el stock sigue operando y reconecta solo.
    depends_on:
      db-stock:
        condition: service_healthy

  # ---------------- API Gateway (RNF05): único punto de entrada ----------------
  # Laravel 12 sobre php:8.3-apache.
  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    image: logitech/api-gateway:1.0.0
    restart: unless-stopped
    networks: [backend]
    ports:
      - "8080:8080"   # el ÚNICO puerto de la aplicación publicado al host
    environment:
      APP_KEY: ${GATEWAY_APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: http://ms-auth-users:8081
      PRODUCTS_URL: http://ms-products:8082
      STOCK_URL: http://ms-inventory-stock:8083
      SUPPLIERS_URL: http://ms-suppliers:8084
      PURCHASES_URL: http://ms-purchases:8085
      AUDIT_URL: http://ms-returns-audit:8086
      UPSTREAM_TIMEOUT: 10
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
    depends_on:
      ms-auth-users:
        condition: service_healthy

volumes:
  db-auth-data:
  db-products-data:
  db-stock-data:
  db-suppliers-data:
  db-purchases-data:
  db-audit-data:
  rabbitmq-data:

networks:
  backend:
